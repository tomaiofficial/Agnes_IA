<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapGenAI — Agnes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e5e7eb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(15, 15, 25, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      z-index: 100;
    }
    .topbar a.back {
      color: #9ca3af;
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .topbar a.back:hover { color: #e5e7eb; }
    .topbar .title {
      font-size: 14px;
      font-weight: 600;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar .title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .topbar .info {
      margin-left: auto;
      font-size: 11px;
      color: #6b7280;
    }
    .iframe-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0a0f;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      z-index: 50;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-overlay .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p {
      margin-top: 16px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="back">← Retour à Agnes</a>
    <div class="title">
      <span class="dot"></span>
      SnapGenAI Veo 3.1
    </div>
    <div class="info">Service tiers — connectez-vous avec Google</div>
  </div>
  <div class="iframe-wrap">
    <div class="loading-overlay" id="loader">
      <div class="spinner"></div>
      <p>Chargement de SnapGenAI...</p>
    </div>
    <iframe
      id="snapgen-frame"
      src="https://snapgen.ai"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>
  <script>
    const frame = document.getElementById('snapgen-frame');
    const loader = document.getElementById('loader');
    frame.addEventListener('load', () => {
      setTimeout(() => loader.classList.add('hidden'), 500);
    });
    // Timeout fallback
    setTimeout(() => loader.classList.add('hidden'), 8000);
  </script>
</body>
</html>
