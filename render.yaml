services:
  - type: web
    name: agnes-ia-api
    runtime: python
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: REDIS_URL
        fromService: agnes-redis
      - key: SUPABASE_URL
        value: YOUR_SUPABASE_URL
      - key: SUPABASE_KEY
        value: YOUR_SUPABASE_KEY
      - key: AWS_ACCESS_KEY_ID
        value: YOUR_AWS_ACCESS_KEY
      - key: AWS_SECRET_ACCESS_KEY
        value: YOUR_AWS_SECRET_KEY
      - key: S3_BUCKET
        value: agnes-ia
      - key: MAX_VRAM
        value: "0.9"
      - key: DEBUG
        value: "false"
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    numInstances: 1
    memoryLimit: 4GB
    diskLimit: 10GB
    cpuLimit: 2
    
  - type: worker
    name: agnes-ia-worker
    runtime: python
    command: celery -A queue.tasks worker --loglevel=info
    envVars:
      - key: REDIS_URL
        fromService: agnes-redis
      - key: SUPABASE_URL
        value: YOUR_SUPABASE_URL
      - key: SUPABASE_KEY
        value: YOUR_SUPABASE_KEY
      - key: AWS_ACCESS_KEY_ID
        value: YOUR_AWS_ACCESS_KEY
      - key: AWS_SECRET_ACCESS_KEY
        value: YOUR_AWS_SECRET_KEY
      - key: S3_BUCKET
        value: agnes-ia
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A queue.tasks worker --loglevel=info
    numInstances: 2
    memoryLimit: 4GB
    diskLimit: 10GB
    cpuLimit: 2

  - type: redis
    name: agnes-redis
    plan: starter