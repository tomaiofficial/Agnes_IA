name: Keep Alive (Hugging Face)

# ════════════════════════════════════════════════════
# Gardien d'éveil : évite le spin-down de l'instance
# Hugging Face Spaces (plan Free : mise en veille après
# ~48 h sans trafic).
#
# Pourquoi toutes les 3 min (et pas 5) :
#   Les cron de GitHub Actions peuvent être retardés de plusieurs minutes
#   en cas de charge. 3 min donnent une marge confortable.
#
# Pourquoi /api/health et pas / :
#   `/` renvoie la page HTML (100 Ko) ; /api/health répond un petit JSON
#   immédiatement. Moins de charge serveur, même effet anti-spin-down.
#
# IMPORTANT — pour SUPPRIMER la veille définitivement :
#   Le plan Free de Hugging Face met le Space en veille après ~48 h sans
#   trafic. Le gardien GitHub Actions = solution gratuite best-effort,
#   pas un contrat. Un upgrade CPU (payant) supprime la veille.
# ════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space /api/health (réveille + maintient éveillé)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://agnes-ia.hf.space/api/health --max-time 90
