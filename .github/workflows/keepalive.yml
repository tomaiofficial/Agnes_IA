name: Keep Alive (Render)

# ════════════════════════════════════════════════════
# Gardien d'éveil : évite le spin-down de l'instance Render
# (plan Free : mise en veille après ~15 min sans trafic).
#
# Pourquoi toutes les 3 min (et pas 5) :
#   Les cron de GitHub Actions peuvent être retardés de plusieurs minutes
#   en cas de charge. Avec 5 min d'intervalle, un retard cumulé > 15 min
#   laissait l'instance se mettre en veille puis redémarrer au ping suivant
#   (cycle visible toutes les ~20-30 min). 3 min donnent une marge ×5.
#
# Pourquoi /api/health et pas / :
#   `/` renvoie la page HTML (100 Ko) ; /api/health répond un petit JSON
#   immédiatement. Moins de charge serveur, même effet anti-spin-down.
#
# IMPORTANT — pour SUPPRIMER la veille définitivement :
#   Le plan Free de Render spin-down est inévitable si un retard laisse
#   passer > 15 min sans requête. La seule solution garantie est un plan
#   payant (Starter, ~7 $/mois) : l'instance ne se met plus JAMAIS en veille.
#   Gardien GitHub Actions = solution gratuite best-effort, pas un contrat.
# ════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health (réveille + maintient éveillé)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://agnes-ia.onrender.com/api/health --max-time 90
