name: Keep Alive B (Render)

# ════════════════════════════════════════════════════
# Gardien d'éveil B — complément de keepalive.yml.
# Ping aux MINUTES IMPAIRES (1, 3, 5, ... 59) pendant
# que keepalive.yml couvre les minutes paires (0, 2, ...).
# Ensemble : ~1 requête par minute → le spin-down Render
# (~15 min sans trafic) devient quasi impossible.
#
# Plan Free = best-effort. Garantie à 100 % : plan Starter.
# ════════════════════════════════════════════════════

on:
  schedule:
    - cron: '1-59/2 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health (minutes impaires)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://agnes-ia2.onrender.com/api/health --max-time 90
