<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes IA - Pipeline Vidéo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            min-width: 200px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .stat-card p {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .jobs-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .job-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        
        .job-card.completed {
            border-left: 5px solid #28a745;
            background: rgba(40, 167, 69, 0.1);
        }
        
        .job-card.failed {
            border-left: 5px solid #dc3545;
            background: rgba(220, 53, 69, 0.1);
        }
        
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .job-id {
            font-weight: bold;
            color: white;
            font-size: 1.1em;
        }
        
        .job-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .job-card:not(.completed):not(.failed) .job-status {
            background: #ffc107;
            color: #212529;
        }
        
        .job-card.completed .job-status {
            background: #28a745;
            color: white;
        }
        
        .job-card.failed .job-status {
            background: #dc3545;
            color: white;
        }
        
        .job-info {
            margin-bottom: 15px;
        }
        
        .current-step {
            color: white;
            font-size: 0.95em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .progress-container {
            height: 25px;
            background: rgba(0,0,0,0.2);
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            transition: width 0.5s ease, background-color 0.3s ease;
            border-radius: 25px;
        }
        
        .job-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .time-remaining {
            color: white;
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .step {
            padding: 5px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 0.85em;
            color: white;
            transition: all 0.3s ease;
        }
        
        .step.completed {
            background: rgba(40, 167, 69, 0.3);
            border: 1px solid #28a745;
        }
        
        .step.current {
            background: rgba(255, 193, 7, 0.3);
            border: 1px solid #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
        }
        
        .step.failed {
            background: rgba(220, 53, 69, 0.3);
            border: 1px solid #dc3545;
        }
        
        .step-name {
            font-weight: 500;
        }
        
        .step-time, .step-status, .step-error {
            margin-left: 5px;
            font-size: 0.8em;
            opacity: 0.8;
        }
        
        .error-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .create-job-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 100;
        }
        
        .create-job-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        
        @media (max-width: 768px) {
            .stats {
                flex-direction: column;
            }
            
            .stat-card {
                width: 100%;
            }
            
            .job-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Agnes IA - Pipeline Vidéo</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Jobs Actifs</h3>
                <p id="active-jobs">0</p>
            </div>
            <div class="stat-card">
                <h3>GPU Usage</h3>
                <p id="gpu-usage">0%</p>
            </div>
            <div class="stat-card">
                <h3>Memory</h3>
                <p id="memory-usage">0 GB</p>
            </div>
        </div>
        
        <div id="jobs-container" class="jobs-container"></div>
    </div>
    
    <button class="create-job-btn" onclick="createNewJob()" title="Créer un nouveau job">+</button>
    
    <script src="/static/js/app.js"></script>
    <script>
        // Fonction pour créer un nouveau job (à adapter selon votre API)
        function createNewJob() {
            const prompt = prompt("Entrez votre prompt pour la génération vidéo:");
            if (!prompt) return;
            
            const priority = prompt("Priorité (premium/admin/free):", "free");
            
            fetch('/api/jobs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    prompt: prompt,
                    priority: priority,
                    user_id: 'user_' + Math.random().toString(36).substr(2, 9)
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.job_id) {
                    console.log('Job créé:', data.job_id);
                } else {
                    alert('Erreur: ' + (data.error || 'Inconnu'));
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('Erreur de connexion au serveur');
            });
        }
        
        // Définir USER_ID pour le WebSocket
        window.USER_ID = 'user_' + Math.random().toString(36).substr(2, 9);
    </script>
</body>
</html>
