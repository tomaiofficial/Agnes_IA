name: Keep Alive (Render)

# ════════════════════════════════════════════════════
# Gardien d'éveil A : évite le spin-down de l'instance
# Render (plan Free : mise en veille après ~15 min sans
# trafic).
#
# Deux gardiens complémentaires (A = minutes paires,
# B = minutes impaires) pinguent ~1×/min au total :
#   - keepalive.yml      : * * * * *  (0, 1, 2, ... 59)
#   - keepalive-b.yml    : * * * * *  (0, 1, 2, ... 59)
# Si un gardien est retardé par GitHub Actions, l'autre
# couvre le trou → la veille devient quasi impossible.
#
# Pourquoi /api/health et pas / :
#   `/` renvoie la page HTML (100 Ko) ; /api/health répond un petit JSON
#   immédiatement. Moins de charge serveur, même effet anti-spin-down.
#
# IMPORTANT — pour SUPPRIMER la veille définitivement :
#   Le plan Free de Render spin-down est inévitable si un retard laisse
#   passer > 15 min sans requête. Gardien GitHub = solution gratuite
#   best-effort. Pour une garantie à 100 % : plan Starter (~7 $/mois).
# ════════════════════════════════════════════════════

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health (réveille + maintient éveillé)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://agnes-ia.onrender.com/api/health --max-time 90
