name: Keep Alive B (Render)

# ════════════════════════════════════════════════════
# Gardien d'éveil B — complément de keepalive.yml.
# Ping toutes les minutes (même que A) pour une redondance
# maximale. GitHub Actions peut retarder les crons de 5-10 min,
# donc deux workflows identiques réduisent le risque de lacune.
#
# Plan Free = best-effort. Garantie à 100 % : plan Starter.
# ════════════════════════════════════════════════════

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health (minutes impaires)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://agnes-ia.onrender.com/api/health --max-time 90
